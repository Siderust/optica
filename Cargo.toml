[package]
name = "optica"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Fast participating-media and optics foundation: typed rays, optical coefficients, phase functions, spectra, and optical-depth integration."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Siderust/optica"
homepage = "https://github.com/Siderust/optica"
documentation = "https://docs.rs/optica"
keywords = ["optics", "radiometry", "atmosphere", "rendering", "spectrum"]
categories = ["science", "rendering", "no-std"]
exclude = [".github/", "target/"]

[features]
default = ["std"]
std = ["alloc", "qtty/std", "affn/std"]
alloc = ["qtty/alloc", "affn/alloc"]
serde = ["dep:serde", "alloc", "qtty/serde", "affn/serde"]
# astro: reserved for future astronomy-specific adapters (off by default).
# The flag currently gates no public items; it exists so downstream crates can
# pin a stable feature set when future astronomy adapters land.
astro = []

[dependencies]
qtty = { version = "0.8", default-features = false, features = ["radiometry"] }
affn = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
